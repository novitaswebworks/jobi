name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Real-terminal checks (pseudo-terminal), Unix only.
      - name: Terminal smoke test
        if: runner.os != 'Windows'
        run: |
          cargo build --locked
          python3 tests/pty_smoke.py target/debug/jobi

  # Tagging vX.Y.Z publishes a GitHub release with prebuilt binaries.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, name: macos-arm64, target: aarch64-apple-darwin }
          - { os: macos-latest, name: macos-x86_64, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          pkg="jobi-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$pkg"
          cp target/${{ matrix.target }}/release/jobi README.md LICENSE "$pkg"/
          tar czf "$pkg.tar.gz" "$pkg"
          shasum -a 256 "$pkg.tar.gz" > "$pkg.tar.gz.sha256"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" jobi-*.tar.gz jobi-*.sha256 --clobber
