[package]
name = "jobi"
version = "0.1.0"
edition = "2024"
description = "A local-first job application tracker for your terminal"
license = "MIT"
authors = ["Novitas WebWorks"]
readme = "README.md"
keywords = ["job-search", "tui", "terminal", "tracker", "sqlite"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
base64 = "0.23.1"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
crossterm = "0.29"
csv = "1.4.0"
iana-time-zone = "0.1.65"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(unix)".dependencies]
signal-hook = "0.4.6"

[dev-dependencies]
proptest = "1.12.0"
